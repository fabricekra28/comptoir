# Prometheus, Alertmanager, Grafana, kube-state-metrics et l'agent de métriques système.
# Le chart vient de son dépôt officiel ; ses réglages viennent de ce dépôt Git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 93.3.0
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/observability/values/kube-prometheus-stack.yaml
    - repoURL: https://github.com/fabricekra28/comptoir.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Les définitions (CRD) de Prometheus sont trop grosses pour l'application classique.
      - ServerSideApply=true
