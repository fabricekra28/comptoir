apiVersion: v1
kind: ConfigMap
metadata:
  name: comptoir-config
  labels:
    {{- include "comptoir.labels" . | nindent 4 }}
data:
  {{- range $name, $svc := .Values.services }}
  {{- if ne $name "gateway" }}
  {{ upper $name }}_SERVICE_URL: {{ printf "http://%s:%d" (include "comptoir.svcName" $name) (int $svc.port) | quote }}
  {{- end }}
  {{- end }}
  APP_NAME: {{ .Values.app.name | quote }}
  CURRENCY: {{ .Values.app.currency | quote }}
  CURRENCY_DECIMALS: {{ int .Values.app.currencyDecimals | quote }}
  APP_TIMEZONE: {{ .Values.app.timezone | quote }}
  TOKEN_HOURS: {{ int .Values.app.tokenHours | quote }}
  SEED_DEMO: {{ .Values.app.seedDemo | quote }}
  COOKIE_SECURE: {{ or .Values.app.cookieSecure (eq (include "comptoir.tlsEnabled" .) "true") | quote }}
