# Réglages pour un cluster k3s local : Traefik (fourni avec k3s) en Gateway API,
# HTTPS avec un certificat auto-signé. Lu par Argo CD en plus de values.yaml.

secrets:
  # Secret créé une fois à la main (voir README.md).
  existingSecret: comptoir-secrets

exposure:
  gatewayApi:
    enabled: true
    gatewayClassName: traefik
    # Ajoutez « <adresse-du-noeud-k3s> comptoir.test » à /etc/hosts sur votre poste.
    hostname: comptoir.test
    # Ports internes de Traefik ; les visiteurs utilisent toujours 80 et 443.
    httpPort: 8000
    httpsPort: 8443
    tls:
      enabled: true
      # Certificat auto-signé créé à la main (voir README.md).
      secretName: comptoir-tls
    # Grafana passe par le même Traefik : https://grafana.test:8443 depuis le Mac.
    extraHosts:
      - name: grafana
        hostname: grafana.test
        namespace: monitoring
        tlsSecretName: grafana-tls

networkPolicy:
  # Sur k3s, Traefik tourne dans kube-system : lui seul peut joindre la gateway.
  gatewayControllerNamespace: kube-system
  # Prometheus (namespace monitoring) peut lire /metrics sur chaque service.
  monitoringNamespace: monitoring

postgresql:
  # Sur Ubuntu 26.04, AppArmor refuse les signaux entre les processus d'un conteneur
  # qui tourne sans droits root. PostgreSQL en a besoin pour démarrer et s'arrêter :
  # son pod tourne donc sans profil AppArmor. Il garde ses autres protections
  # (sans root, aucune capacité Linux, seccomp, système de fichiers en lecture seule).
  appArmorProfile: Unconfined
