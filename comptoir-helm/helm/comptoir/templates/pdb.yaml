{{/* Lors d'une maintenance de noeud, garde au moins un pod de chaque service répliqué. */}}
{{- range $name, $svc := .Values.services }}
{{- if gt (int $svc.replicas) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "comptoir.svcName" $name }}
  labels:
    {{- include "comptoir.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "comptoir.selector" (dict "root" $ "component" $name) | nindent 6 }}
{{- end }}
{{- end }}
