{{- range $name, $svc := .Values.services }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "comptoir.svcName" $name }}
  labels:
    {{- include "comptoir.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  {{- if and (eq $name "gateway") (not $.Values.exposure.gatewayApi.enabled) }}
  type: {{ $.Values.exposure.service.type }}
  {{- else }}
  type: ClusterIP
  {{- end }}
  selector:
    {{- include "comptoir.selector" (dict "root" $ "component" $name) | nindent 4 }}
  ports:
    - name: http
      port: {{ int $svc.port }}
      targetPort: http
      {{- if and (eq $name "gateway") (not $.Values.exposure.gatewayApi.enabled) (eq $.Values.exposure.service.type "NodePort") }}
      nodePort: {{ int $.Values.exposure.service.nodePort }}
      {{- end }}
{{- end }}
