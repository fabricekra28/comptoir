{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: comptoir-secrets
  labels:
    {{- include "comptoir.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ required "Renseignez secrets.existingSecret (recommandé) ou secrets.jwtSecret" .Values.secrets.jwtSecret | quote }}
  INTERNAL_TOKEN: {{ required "Renseignez secrets.existingSecret (recommandé) ou secrets.internalToken" .Values.secrets.internalToken | quote }}
  POSTGRES_PASSWORD: {{ required "Renseignez secrets.existingSecret (recommandé) ou secrets.postgresPassword" .Values.secrets.postgresPassword | quote }}
  ADMIN_EMAIL: {{ .Values.secrets.adminEmail | quote }}
  ADMIN_PASSWORD: {{ .Values.secrets.adminPassword | quote }}
{{- end }}
