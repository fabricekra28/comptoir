{% extends "base.html" %}
{% block title %}Se connecter — {{ app_name }}{% endblock %}
{% block content %}
<div class="panel narrow">
  <h1>Se connecter</h1>
  {% if error %}<div class="flash error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/connexion">
    <input type="hidden" name="next" value="{{ next }}">
    <div class="field">
      <label for="email">Adresse e-mail</label>
      <input id="email" type="email" name="email" value="{{ email }}" autocomplete="email" required autofocus>
    </div>
    <div class="field">
      <label for="password">Mot de passe</label>
      <input id="password" type="password" name="password" autocomplete="current-password" required>
    </div>
    <button class="btn" type="submit">Se connecter</button>
  </form>
  <p class="small" style="margin:1.25rem 0 0">Pas encore de compte ? <a href="/inscription?next={{ next|urlencode }}">Créer un compte</a></p>
</div>
{% endblock %}
