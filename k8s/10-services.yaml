# Un Deployment et un Service par microservice.
# « image » : remplacez VOTRE_REGISTRE par votre registre d'images.
# livenessProbe : le processus répond ; readinessProbe : il peut servir (base joignable).
# Deux réplicas par service : la perte d'un pod ne coupe pas le service.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: microservices
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: VOTRE_REGISTRE/gateway:2.0
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: boutique-config
            - secretRef:
                name: boutique-secrets
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: microservices
spec:
  selector:
    app: gateway
  ports:
    - port: 8000
      targetPort: 8000
